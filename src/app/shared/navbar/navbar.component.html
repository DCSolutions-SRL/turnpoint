<div class="navbar-container">
    <nav class="navbar">
        <div class="navbar-brand">
                        <a href="https://www.dcs.ar" target="_blank" rel="noopener">
                            <img src="TurnPoint_icon.svg" alt="Logo" class="navbar-logo">
                        </a>
                        <button class="btn btn-descanso" (click)="toggleDescanso()">
                            <i class="fa-solid fa-mug-hot"></i> Descanso
                        </button>
        </div>
        <div class="navbar-links">
            <a class="btn nav-link" *ngIf="rolUser===1" (click)="navigate('/alta-usuarios')">
                <i class="fa-solid fa-users"></i> Alta de Usuarios
            </a>
            <a class="btn nav-link" *ngIf="rolUser===1" (click)="navigate('/logs')">
                <i class="fa-solid fa-file-alt"></i> Registro de ingresos
            </a>
            <a class="btn nav-link" *ngIf="rolUser===1" (click)="navigate('/atencion-cliente')">
                <i class="fa-solid fa-headset"></i> Atención al Cliente
            </a>
            <div class="user-dropdown" *ngIf="userInfo">
                <button class="btn nav-link dropdown-toggle" (click)="toggleMenu()">
                   <i class="fa-regular fa-user"></i> {{ userInfo.nombre }} {{ userInfo.apellido }}
                </button>
                <div class="dropdown-menu" *ngIf="showMenu">
                    <p><b>Rol:</b> {{ userInfo.rol === 1 ? 'Administrador' : userInfo.rol === 2 ? 'Usuario' : 'Desconocido' }}</p>
                    <button class="btn logout-btn" (click)="logout()">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>  
</div>

<!-- Overlay de descanso -->
<div class="descanso-overlay" *ngIf="descansoActivo" (click)="cancelarDescanso()">
    <div class="descanso-content">
        <h1>DESCANSO</h1>
        <div class="contador" [class.tiempo-negativo]="esTiempoNegativo()">{{ tiempoRestanteFormateado }}</div>
        <p class="instruccion">Presiona cualquier tecla o toca la pantalla para cancelar</p>
    </div>
</div>
